<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Prosperus-Cons</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/imagine/pro.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0f172a;
            --sidebar-active: #f97316;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            color: var(--primary-blue);
            padding: 24px;
        }

        .not-found-card {
            max-width: 680px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 46px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
        }

        .code {
            font-size: 5rem;
            font-weight: 900;
            color: var(--sidebar-active);
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 2rem;
        }

        p {
            margin: 0 0 28px;
            color: var(--text-muted);
            line-height: 1.7;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 22px;
            border-radius: 8px;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            font-weight: 800;
        }

        a:hover {
            background: var(--sidebar-active);
        }
    </style>
</head>
<body>
    <main class="not-found-card">
        <div class="code">404</div>
        <h1>Pagina nu a fost găsită</h1>
        <p>Adresa accesată nu există sau a fost mutată. Revino la pagina principală și continuă navigarea în platformă.</p>
        <a href="/">Înapoi la pagina principală</a>
    </main>
</body>
</html>
